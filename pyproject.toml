[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-downloader"
version = "0.1.0"
description = "Baixa o melhor áudio do YouTube ou SoundCloud e converte para MP3/FLAC"
requires-python = ">=3.12"
dependencies = ["yt-dlp", "mutagen"]

[project.scripts]
mdl = "music_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: testes que acessam a rede (rodar sob demanda)"]
addopts = "-m 'not integration'"
